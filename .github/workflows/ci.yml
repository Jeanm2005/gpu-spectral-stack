name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff, actionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      - name: ruff
        run: |
          ruff check .
          ruff format --check .

      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  cuda:
    name: Build (CUDA 13.4, sm_${{ matrix.arch }})
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.4.3-devel-ubuntu26.04
    strategy:
      fail-fast: false
      matrix:
        # Every architecture CUDA 13 supports: Turing through Blackwell.
        arch: ["75", "80", "86", "89", "90", "100", "120"]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake g++ make

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CUDA_ARCHITECTURES=${{ matrix.arch }}
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build -j

  extension:
    name: PyTorch extension (CUDA 13.4, torch cu130)
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.4.3-devel-ubuntu26.04
    env:
      TORCH_CUDA_ARCH_LIST: "12.0"  # no GPU to detect, so name the target explicitly
    steps:
      # git first: without it actions/checkout downloads a tarball with no .git, and DVC and
      # the dataset metadata (which records the commit) need a real clone.
      - name: Install Python, build tools, and git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv python3-dev g++ \
            git ca-certificates

      - uses: actions/checkout@v4

      - name: Let git work in the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Each step runs in a new shell, so the venv goes on PATH instead of being activated.
      - name: Create the virtual environment
        run: |
          python3 -m venv /opt/venv
          echo "/opt/venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cu130
          pip install -r requirements.txt

      - name: Build and install the extension
        run: pip install -e . --no-build-isolation

      - name: Run the tests (GPU tests skip)
        run: pytest -q

      # The whole data pipeline (generate -> validate -> report) on a CI-sized config: a few
      # 32 x 32 trajectories through the float64 NumPy solver. Fails if validation fails.
      - name: Data pipeline end to end (dvc repro)
        run: |
          cp configs/ci-params.yaml params.yaml
          dvc repro
          cat reports/DATASET_CARD.md

  results:
    name: Figures and README tables from the committed results
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install plotting dependencies
        run: pip install numpy matplotlib

      # Drawing proves the committed data still parses and every figure still renders; the PNGs
      # themselves are not compared (fonts and library versions change pixels).
      - name: Redraw the figures
        run: python tools/make_figures.py --figures "$RUNNER_TEMP/figures"

      - name: README tables match the committed results
        run: python tools/results_table.py --check
