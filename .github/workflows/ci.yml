name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff, actionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      - name: ruff
        run: |
          ruff check .
          ruff format --check .

      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  cuda:
    name: Build (CUDA 13.4)
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.4.3-devel-ubuntu26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake g++ make

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CUDA_ARCHITECTURES=120
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build -j

  extension:
    name: PyTorch extension (CUDA 13.4, torch cu130)
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.4.3-devel-ubuntu26.04
    env:
      TORCH_CUDA_ARCH_LIST: "12.0"  # no GPU to detect, so name the target explicitly
    steps:
      - uses: actions/checkout@v4

      - name: Install Python and build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv python3-dev g++

      # Each step runs in a new shell, so the venv goes on PATH instead of being activated.
      - name: Create the virtual environment
        run: |
          python3 -m venv /opt/venv
          echo "/opt/venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cu130
          pip install -r requirements.txt

      - name: Build and install the extension
        run: pip install -e . --no-build-isolation

      - name: Run the tests (GPU tests skip)
        run: pytest -q