[build-system]
requires = ["setuptools>=77", "wheel", "torch"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-spectral-stack"
version = "0.1.0"
description = "FFT kernels in CUDA, a GPU spectral PDE solver, and a custom FNO layer"
requires-python = ">=3.10"
dependencies = ["torch", "numpy"]

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["spectral"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["gpu: needs a CUDA GPU; skipped automatically when none is visible"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["python", "tests"]
# Imported from gpu-rf-pipeline; rewritten for this repository in Tasks 0.4 and 0.5.
extend-exclude = ["tools/make_figures.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "NPY"]